<vex-page-layout>
  <ngx-spinner
    name="userSpinner"
    bdColor="rgba(0, 0, 0, 0.8)"
    size="small"
    color="#fff"
    [fullScreen]="false"
    type="ball-climbing-dot"
    template="<img src='../../../../../assets/img/zurit/logo.png' width='50px' height='50px'>"
    ><p style="color: white">Cargando...</p></ngx-spinner
  >
  <vex-page-layout-header
    class="pb-16"
    fxLayout="column"
    fxLayoutAlign="center start"
  >
    <div
      [class.container]="layoutCtrl.value === 'boxed'"
      [class.px-gutter]="layoutCtrl.value === 'fullwidth'"
      class="w-full flex flex-col sm:flex-row justify-between"
    >
      <div>
        <h1 class="title mt-0 mb-1">Registro de Usuarios</h1>
        <vex-breadcrumbs
          [crumbs]="[
            { value: 'Módulo Administrativo', router: '/app' },
            { value: 'Registro de Usuarios', router: '/app/usuarios' }
          ]"
        ></vex-breadcrumbs>
      </div>
    </div>
  </vex-page-layout-header>

  <vex-page-layout-content
    [class.container]="layoutCtrl.value === 'boxed'"
    [class.px-gutter]="layoutCtrl.value === 'fullwidth'"
    class="-mt-6"
  >
    <div class="card overflow-auto -mt-16">
      <div
        class="bg-app-bar px-6 h-16 border-b sticky left-0"
        fxLayout="row"
        fxLayoutAlign="start center"
      >
        <button
          (click)="createUser()"
          class="ml-4"
          color="primary"
          fxFlex="none"
          mat-mini-fab
          matTooltip="Crear un nuevo Usuario"
          type="button"
        >
          <mat-icon [icIcon]="icAdd"></mat-icon></button
        >&nbsp;&nbsp;
        <h2
          class="title my-0 ltr:pr-4 rtl:pl-4 ltr:mr-4 rtl:ml-4 ltr:border-r rtl:border-l"
          fxFlex="none"
          fxHide.xs
        >
          <span *ngIf="selection.isEmpty()">Usuarios</span>
          <span *ngIf="selection.hasValue()"
            >{{ selection.selected.length }} Usuario<span
              *ngIf="selection.selected.length > 1"
              >s</span
            >
            seleccionados</span
          >
        </h2>

        <div
          *ngIf="selection.hasValue()"
          class="mr-4 pr-4 border-r"
          fxFlex="none"
        >
          <button
            (click)="deleteUsers(selection.selected)"
            color="primary"
            mat-icon-button
            matTooltip="Eliminar seleccionados"
            type="button"
          >
            <mat-icon [icIcon]="icDelete"></mat-icon>
          </button>
        </div>

        <div
          class="bg-card rounded-full border px-4"
          fxFlex="400px"
          fxFlex.lt-md="auto"
          fxHide.xs
          fxLayout="row"
          fxLayoutAlign="start center"
        >
          <ic-icon [icIcon]="icSearch" size="20px"></ic-icon>
          <input
            [formControl]="searchCtrl"
            (keyup.enter)="onFilterChange(searchCtrl.value)"
            class="px-4 py-3 border-0 outline-none w-full bg-transparent"
            placeholder="Buscar..."
            type="search"
          />
          <button
            (click)="onFilterChange(searchCtrl.value)"
            color="primary"
            mat-icon-button
            matTooltip="Buscar"
            type="button"
          >
            <mat-icon [icIcon]="icSearch"></mat-icon>
          </button>
        </div>
        <button
          (click)="onFilterChange('')"
          color="primary"
          mat-icon-button
          matTooltip="Restablecer datos de la tabla"
          type="button"
        >
          <mat-icon>
            <span class="material-symbols-outlined"> restart_alt </span>
          </mat-icon>
        </button>
        <span fxFlex></span>

        <button
          class="ml-4"
          fxFlex="none"
          fxHide.gt-xs
          mat-icon-button
          type="button"
        >
          <mat-icon [icIcon]="icSearch"></mat-icon>
        </button>

        <button
          [matMenuTriggerFor]="columnFilterMenu"
          class="ml-4"
          fxFlex="none"
          mat-icon-button
          matTooltip="Filtrar Columnas"
          type="button"
        >
          <mat-icon [icIcon]="icFilterList"></mat-icon>
        </button>
        <mat-progress-spinner
          diameter="20"
          mode="indeterminate"
          color="primary"
          *ngIf="spinnerDown"
        ></mat-progress-spinner>
        <div *ngIf="!spinnerDown">
          <button
            (click)="exportToExcel()"
            matTooltip="Descargar tabla"
            mat-icon-button
          >
            <mat-icon>
              <span class="material-symbols-outlined"> download </span>
            </mat-icon>
          </button>
        </div>
      </div>
      <table
        @stagger
        [dataSource]="dataSource"
        class="w-full"
        mat-table
        matSort
      >
        <!--- Note that these columns can be defined in any order.
                The actual rendered columns are set as a property on the row definition" -->

        <!-- Checkbox Column -->
        <ng-container matColumnDef="checkbox">
          <th *matHeaderCellDef mat-header-cell>
            <mat-checkbox
              (change)="$event ? masterToggle() : null"
              [checked]="selection.hasValue() && isAllSelected()"
              [indeterminate]="selection.hasValue() && !isAllSelected()"
              color="primary"
            >
            </mat-checkbox>
          </th>
          <td *matCellDef="let row" class="w-4" mat-cell>
            <mat-checkbox
              (change)="$event ? selection.toggle(row) : null"
              (click)="$event.stopPropagation()"
              [checked]="selection.isSelected(row)"
              color="primary"
            >
            </mat-checkbox>
          </td>
        </ng-container>

        <!-- Image Column
          <ng-container matColumnDef="image">
            <th *matHeaderCellDef mat-header-cell></th>
            <td *matCellDef="let row" class="w-8 min-w-8 pr-0" mat-cell>
              <img [src]="row['imageSrc']" class="avatar h-8 w-8 align-middle">
            </td>
          </ng-container>
                          -->

        <!-- Text Columns -->
        <ng-container *ngFor="let column of columns; trackBy: trackByProperty">
          <ng-container
            *ngIf="column.type === 'text'"
            [matColumnDef]="column.property"
          >
            <th
              *matHeaderCellDef
              class="uppercase"
              mat-header-cell
              mat-sort-header
            >
              {{ column.label }}
            </th>
            <td *matCellDef="let row" [ngClass]="column.cssClasses" mat-cell>
              <div *ngIf="column.property != 'createdBy'">
                {{ row[column.property] }}
              </div>
              <div *ngIf="column.property === 'createdBy'">
                {{ row[column.property].name }}
              </div>
            </td>
          </ng-container>
        </ng-container>
        <!-- Status Columns -->
        <ng-container matColumnDef="status">
          <th
            *matHeaderCellDef
            class="uppercase"
            mat-header-cell
            mat-sort-header
          >
            Estado
          </th>
          <td *matCellDef="let row" mat-cell>
            <div
              (click)="$event.stopPropagation()"
              fxLayoutAlign="start center"
              fxLayoutGap="4px"
            >
              <div
                [ngClass]="[
                  selectStatusById(row.status).textClass,
                  selectStatusById(row.status).bgClass
                ]"
                class="rounded px-2 py-1 font-medium text-xs"
                fxFlex="none"
              >
                {{ selectStatusById(row.status).text }}
              </div>
              <div
                (click)="statusSelect.open()"
                class="text-secondary bg-base text-hint cursor-pointer hover:bg-hover"
                fxFlex="none"
                fxLayout="row"
                fxLayoutAlign="center center"
              >
                <ic-icon [icon]="icArrowDropDown" size="18px"></ic-icon>
              </div>
              <mat-select
                #statusSelect="matSelect"
                (selectionChange)="onStatusChange($event, row)"
                [value]="selectStatusById(row.status)"
                class="invisible w-0 h-0 text-sm"
                fxFlex="0 1 0px"
              >
                <mat-option *ngFor="let stat of status" [value]="stat">
                  <div
                    [ngClass]="stat.previewClass"
                    class="h-6 w-6 align-middle ltr:mr-2 rtl:ml-2 rounded inline-block"
                  ></div>
                  <span>{{ stat.text }}</span>
                </mat-option>
              </mat-select>
            </div>
          </td>
        </ng-container>
        <!-- Action Column -->
        <ng-container matColumnDef="actions">
          <th
            *matHeaderCellDef
            class="uppercase"
            mat-header-cell
            mat-sort-header
          >
            Acciones
          </th>
          <td *matCellDef="let row" class="w-10 text-secondary" mat-cell>
            <button
              (click)="$event.stopPropagation()"
              [matMenuTriggerData]="{ user: row }"
              [matMenuTriggerFor]="actionsMenu"
              mat-icon-button
              type="button"
            >
              <mat-icon [icIcon]="icMoreHoriz"></mat-icon>
            </button>
          </td>
        </ng-container>

        <tr *matHeaderRowDef="visibleColumns" mat-header-row></tr>
        <tr
          (click)="updateUser(row)"
          *matRowDef="let row; columns: visibleColumns"
          @fadeInUp
          class="hover:bg-hover trans-ease-out"
          mat-row
        ></tr>
        <tr class="mat-row" *matNoDataRow>
          <td
            class="mat-cell"
            [attr.colspan]="visibleColumns.length"
            style="text-align: center"
          >
            No se encontraron Usuarios en el Sistema.
          </td>
        </tr>
      </table>
      <mat-paginator
        [pageSizeOptions]="pageSizeOptions"
        [length]="totalData"
        [pageSize]="pageSize"
        class="sticky left-0"
      ></mat-paginator>
    </div>
  </vex-page-layout-content>
</vex-page-layout>

<mat-menu #columnFilterMenu="matMenu" xPosition="before" yPosition="below">
  <button
    (click)="toggleColumnVisibility(column, $event)"
    *ngFor="let column of columns"
    class="checkbox-item mat-menu-item"
  >
    <mat-checkbox
      (click)="$event.stopPropagation()"
      [(ngModel)]="column.visible"
      color="primary"
    >
      {{ column.label }}
    </mat-checkbox>
  </button>
</mat-menu>

<mat-menu #actionsMenu="matMenu" xPosition="before" yPosition="below">
  <ng-template let-user="user" matMenuContent>
    <button (click)="sendNotification(user)" mat-menu-item>
      <mat-icon [icIcon]="icAlarm"></mat-icon>
      <span>Enviar Correo de Activación</span>
    </button>
    <button (click)="updateUser(user)" mat-menu-item>
      <mat-icon [icIcon]="icEdit"></mat-icon>
      <span>Modificar</span>
    </button>
    <button (click)="deleteUser(user)" mat-menu-item>
      <mat-icon [icIcon]="icDelete"></mat-icon>
      <span>Eliminar</span>
    </button>
  </ng-template>
</mat-menu>
