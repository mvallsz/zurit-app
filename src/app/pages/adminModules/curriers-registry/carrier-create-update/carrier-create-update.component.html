<form (ngSubmit)="save()" [formGroup]="form">
  <div fxLayout="row" fxLayoutAlign="start center" mat-dialog-title>

    <h2 *ngIf="form.get('name').value"
        class="headline m-0"
        fxFlex="auto">{{ form.get('name').value }}</h2>
    <h2 *ngIf="!form.get('name').value"
        class="headline m-0"
        fxFlex="auto">New Carrier</h2>

    <button class="text-secondary" mat-dialog-close mat-icon-button type="button">
      <mat-icon [icIcon]="icClose"></mat-icon>
    </button>
  </div>

  <mat-divider class="-mx-6 text-border"></mat-divider>

  <mat-dialog-content fxLayout="column">
    <div class="flex flex-col sm:flex-row">
      <mat-form-field class="mt-6 flex-auto">
        <mat-label>Carrier Name</mat-label>
        <input cdkFocusInitial formControlName="name" matInput>

        <mat-icon [icIcon]="icCar" class="mr-3" matPrefix></mat-icon>
      </mat-form-field>


    </div>

    <mat-form-field class="flex-auto">
      <mat-label>Street</mat-label>
      <input formControlName="street" matInput>

      <mat-icon [icIcon]="icEditLocation" class="mr-3" matPrefix></mat-icon>
    </mat-form-field>

    <div class="flex flex-col sm:flex-row">
      <mat-form-field class="flex-auto">
        <mat-label>Zipcode</mat-label>
        <input formControlName="zipcode" matInput>

        <mat-icon [icIcon]="icMyLocation" class="mr-3" matPrefix></mat-icon>
      </mat-form-field>

      <mat-form-field class="sm:ml-6 flex-auto">
        <mat-label>City</mat-label>
        <input formControlName="city" matInput>

        <mat-icon [icIcon]="icLocationCity" class="mr-3" matPrefix></mat-icon>
      </mat-form-field>
    </div>

    <mat-form-field class="flex-auto">
      <mat-label>Phone Number</mat-label>
      <input formControlName="phoneNumber" matInput>

      <mat-icon [icIcon]="icPhone" class="mr-3" matPrefix></mat-icon>
    </mat-form-field>

    <mat-form-field class="flex-auto">
      <mat-label>Email</mat-label>
      <input formControlName="email" matInput>

      <mat-icon [icIcon]="icMail" class="mr-3" matPrefix></mat-icon>
    </mat-form-field>

    <mat-form-field fxFlex="auto">
      <mat-label>Carrier Type</mat-label>
      <mat-select formControlName="carrierType" matInput (selectionChange)="openRate()">
        <mat-option  value ="">
          <span>SELECT A CARRIER TYPE</span>
        </mat-option>
        <mat-option  value ="1">
          <span>OUTGOING CARRIER</span>
        </mat-option>
        <mat-option value ="2">
          <span>INCOMING CARRIER</span>
        </mat-option>
      </mat-select>
      <mat-icon [icIcon]="icArrow" class="mr-3" matPrefix></mat-icon>
      <mat-hint>Carrier Type</mat-hint>
    </mat-form-field>
    <div *ngIf="isOutgoing">
      <mat-form-field class="flex-auto">
        <mat-label>Carrier Rate</mat-label>
        <input formControlName="carrierRate" matInput>

        <mat-icon [icIcon]="icMoney" class="mr-3" matPrefix></mat-icon>
      </mat-form-field>
    </div>
    <mat-form-field class="flex-auto">
      <mat-label>Notes</mat-label>
      <textarea formControlName="notes" matInput></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close type="button">CANCEL</button>
    <div fxLayout="row" fxLayoutAlign="center center" >
      <mat-progress-spinner diameter="40" mode="indeterminate" color="primary" *ngIf="spinner"></mat-progress-spinner>
    </div>
    <div *ngIf="!spinner">
      <button *ngIf="isCreateMode()" color="primary" mat-button type="submit">CREATE CARRIER</button>
      <button *ngIf="isUpdateMode()" color="primary" mat-button type="submit">UPDATE CARRIER</button>
    </div>
  </mat-dialog-actions>
</form>

<mat-menu #settingsMenu="matMenu" xPosition="before" yPosition="below">
  <button mat-menu-item>
    <mat-icon [icIcon]="icPrint"></mat-icon>
    <span>Print</span>
  </button>

  <button mat-menu-item>
    <mat-icon [icIcon]="icDownload"></mat-icon>
    <span>Export</span>
  </button>

  <button mat-menu-item>
    <mat-icon [icIcon]="icDelete"></mat-icon>
    <span>Delete</span>
  </button>
</mat-menu>
