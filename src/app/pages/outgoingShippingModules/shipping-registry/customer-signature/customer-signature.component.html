<mat-dialog-content fxLayout="column">
  <div class="flex flex-col sm:flex-row gap-4">
    <div class="card flex-auto">
      <div class="px-6 py-4 border-b flex items-center">
        <h2 class="headline m-0" fxFlex="auto">Delivery confirmation</h2>
        <button
          class="text-secondary"
          mat-dialog-close
          mat-icon-button
          type="button"
        >
          <mat-icon [icIcon]="icClose"></mat-icon>
        </button>
      </div>
      <div class="px-6 py-4 flex flex-col">
        <div class="m-0" fxFlex="auto" [innerHTML]="this.packageToShow"></div>
      </div>
      <div class="px-6 py-4 flex flex-col">
        <div class="flex flex-col sm:flex-row" style="padding-top: 20px">
          <mat-form-field class="flex-auto">
            <mat-label>Customer</mat-label>
            <input
              type="text"
              [formControl]="customerCtrl"
              matInput
              width="100%"
            />
          </mat-form-field>
        </div>
        <div class="flex flex-col sm:flex-row" style="padding-top: 20px">
          <mat-form-field class="flex-auto">
            <mat-label>Delivery Date</mat-label>
            <input
              type="text"
              [formControl]="deliveryDateCtrl"
              matInput
              width="100%"
            />
          </mat-form-field>
        </div>
        <div class="flex flex-col sm:flex-row" style="padding-top: 20px">
          <mat-checkbox
            class="checkbox"
            [formControl]="notificationCtrl"
            value="false"
          >
            Send a notification email to the customer?
          </mat-checkbox>
        </div>
        <h3>Please Sign here</h3>
        <div fxLayout="row" fxLayoutAlign="start center">
          <canvas
            style="border: #001b44 dashed"
            #canvas
            (touchstart)="startDrawing($event)"
            (touchmove)="moved($event)"
          ></canvas>
        </div>
        <div class="flex flex-col sm:flex-row" style="padding-top: 20px">
          <button color="warn" mat-raised-button (click)="clearPad()">
            Clear
          </button>
          <button color="primary" mat-raised-button (click)="savePad()">
            Save
          </button>
        </div>
        <div class="flex flex-col sm:flex-row" style="padding-top: 20px">
          <img src="{{ signatureImg }}" />
        </div>

        <mat-divider></mat-divider>
        <br />
        <div class="flex items-center justify-end gap-2">
          <div fxLayout="row" fxLayoutAlign="center center">
            <mat-progress-spinner
              diameter="40"
              mode="indeterminate"
              color="primary"
              *ngIf="spinner"
            ></mat-progress-spinner>
          </div>
          <div *ngIf="!spinner">
            <button
              (click)="submit()"
              [disabled]="false"
              color="primary"
              mat-raised-button
            >
              PACKAGE DELIVERED
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</mat-dialog-content>
