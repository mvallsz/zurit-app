<div class="card overflow-hidden" fxLayout="column" fxLayout.gt-sm="row">
  <div class="p-6 bg-app-bar" id="printable" >
    <mat-card class="max-w-full">
      <mat-card-header>
        <mat-card-subtitle style="font-size: 32pt;">
          <br>
          {{this.defaults.type}}-{{this.defaults.name }}
          <br>
        </mat-card-subtitle>
        <mat-card-title>
        </mat-card-title>
      </mat-card-header>
      <qr-code [value]="urlItem" size="600"></qr-code>
      <mat-card-content>
        <br>
        <h3 class="title mt-0 mb-4" style="font-size: 20pt;">
          Departure Hub: {{this.defaults.departureHub.name}}
        </h3>
        <h3 class="title mt-0 mb-4" style="font-size: 20pt;">
          Arrival Hub: {{this.defaults.arrivalHub.name}}
        </h3>
        <h2 class="title mt-0 mb-4" style="font-size: 18pt;">
          Arrival Date: {{this.defaults.arrivalDate}}
        </h2>

        <p></p>
      </mat-card-content>
      <mat-divider></mat-divider>
      <mat-card-actions>
        <div fxLayout="row">
          <span fxFlex></span>
          <button color="primary" (click)="onPrint()" >PRINT</button>
        </div>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
