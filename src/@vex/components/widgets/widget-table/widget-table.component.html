<div class="card overflow-auto w-full" fxLayout="column">
  <div class="border-b py-4 px-6" fxLayout="row" fxLayoutAlign="start center">
    <h2 class="m-0 title" fxFlex="auto">{{ title }}</h2>
  </div>

  <table
    [dataSource]="dataSource"
    class="w-full overflow-auto"
    mat-table
    matSort
  >
    <ng-container *ngFor="let column of columns">
      <ng-container
        *ngIf="column.type === 'text'"
        [matColumnDef]="column.property"
      >
        <th *matHeaderCellDef mat-header-cell mat-sort-header>
          {{ column.label }}
        </th>
        <td *matCellDef="let row" [ngClass]="column.cssClasses" mat-cell>
          <div
            *ngIf="
              column.property !== 'departureDate' &&
              column.property !== 'customer' &&
              column.property !== 'name'
            "
          >
            {{ row[column.property] }}
          </div>
          <div
            *ngIf="column.property === 'name'"
            matTooltip="{{ row[column.property] }}"
          >
            {{
              row[column.property] > 15
                ? row[column.property].substr(0, 15) + "..."
                : row[column.property]
            }}
          </div>
          <div
            *ngIf="column.property === 'customer'"
            matTooltip="{{ row[column.property] }}"
          >
            {{ row[column.property].tlCargoName }}
          </div>
          <div *ngIf="column.property === 'departureDate'">
            {{ row[column.property].split("T")[0] }}
          </div>
        </td>
      </ng-container>

      <ng-container
        *ngIf="column.type === 'badge'"
        [matColumnDef]="column.property"
      >
        <th *matHeaderCellDef mat-header-cell mat-sort-header>
          {{ column.label }}
        </th>
        <td *matCellDef="let row" [ngClass]="column.cssClasses" mat-cell>
          <div
            *ngIf="row[column.property] === '1'"
            class="w-3 h-3 rounded-full bg-gray cursor-pointer"
            matTooltip="In warehouse"
          ></div>
          <div
            *ngIf="row[column.property] === '2'"
            class="w-3 h-3 rounded-full bg-cyan cursor-pointer"
            matTooltip="Repacking"
          ></div>
          <div
            *ngIf="row[column.property] === '3'"
            class="w-3 h-3 rounded-full bg-red cursor-pointer"
            matTooltip="In Process"
          ></div>
          <div
            *ngIf="row[column.property] === '4'"
            class="w-3 h-3 rounded-full bg-orange cursor-pointer"
            matTooltip="In Transit"
          ></div>
          <div
            *ngIf="row[column.property] === '5'"
            class="w-3 h-3 rounded-full bg-purple cursor-pointer"
            matTooltip="On Destination"
          ></div>
          <div
            *ngIf="row[column.property] === '6'"
            class="w-3 h-3 rounded-full bg-green cursor-pointer"
            matTooltip="Delivered"
          ></div>
        </td>
      </ng-container>

      <ng-container
        *ngIf="column.type === 'ship-badge'"
        [matColumnDef]="column.property"
      >
        <th *matHeaderCellDef mat-header-cell mat-sort-header>
          {{ column.label }}
        </th>
        <td *matCellDef="let row" [ngClass]="column.cssClasses" mat-cell>
          <div
            *ngIf="row[column.property] === '1'"
            class="w-3 h-3 rounded-full bg-gray cursor-pointer"
            matTooltip="In process"
          ></div>
          <div
            *ngIf="row[column.property] === '2'"
            class="w-3 h-3 rounded-full bg-cyan cursor-pointer"
            matTooltip="In Transit"
          ></div>
          <div
            *ngIf="row[column.property] === '3'"
            class="w-3 h-3 rounded-full bg-purple cursor-pointer"
            matTooltip="On Destination Hub"
          ></div>
          <div
            *ngIf="row[column.property] === '4'"
            class="w-3 h-3 rounded-full bg-green cursor-pointer"
            matTooltip="On Destination WH"
          ></div>
        </td>
      </ng-container>

      <!-- Action Column -->
      <ng-container
        *ngIf="column.type === 'actions'"
        [matColumnDef]="column.property"
      >
        <th *matHeaderCellDef class="uppercase" mat-header-cell mat-sort-header>
          Actions
        </th>
        <td *matCellDef="let row" class="w-10 text-secondary" mat-cell>
          <ng-container *ngIf="type === 'guide'">
            <button
              (click)="$event.stopPropagation()"
              [matMenuTriggerData]="{ guide: row }"
              [matMenuTriggerFor]="actionsMenu"
              mat-icon-button
              type="button"
            >
              <mat-icon [icIcon]="icMoreHoriz"></mat-icon>
            </button>
          </ng-container>
          <ng-container *ngIf="type === 'ship'">
            <button
              (click)="$event.stopPropagation()"
              [matMenuTriggerData]="{ ship: row }"
              [matMenuTriggerFor]="actionsMenu"
              mat-icon-button
              type="button"
            >
              <mat-icon [icIcon]="icMoreHoriz"></mat-icon>
            </button>
          </ng-container>
        </td>
      </ng-container>
    </ng-container>
    <tr *matHeaderRowDef="visibleColumns" mat-header-row></tr>
    <ng-container *ngIf="type === 'ship'">
      <tr
        *matRowDef="let row; columns: visibleColumns"
        style="cursor: pointer"

        mat-row
      ></tr>
    </ng-container>
    <ng-container *ngIf="type === 'guide'">
      <tr
        *matRowDef="let row; columns: visibleColumns"
        style="cursor: pointer"
        mat-row
      ></tr>
    </ng-container>
    <!--suppress UnnecessaryLabelJS -->
  </table>

  <mat-paginator [pageSize]="pageSize" class="paginator"></mat-paginator>
</div>

<mat-menu #actionsMenu="matMenu" xPosition="before" yPosition="below">
  <ng-container *ngIf="type === 'guide'">
    <ng-template let-guide="guide" matMenuContent>
      <button mat-menu-item>
        <mat-icon [icIcon]="icPrint"></mat-icon>
        <span>Print Package PickList</span>
      </button>
    </ng-template>
  </ng-container>
  <ng-container *ngIf="type === 'ship'">
    <ng-template let-ship="ship" matMenuContent>
      <button mat-menu-item>
        <mat-icon [icIcon]="icPrint"></mat-icon>
        <span>Print Manifest</span>
      </button>
      <button [routerLink]="['/app/ships/settle/' + ship._id]" mat-menu-item>
        <mat-icon class="icon material-icons-two-tone" fontIcon="flight_takeoff"
          >flight_takeoff</mat-icon
        >
        <span>Settle Shipping</span>
      </button>
      <button [routerLink]="['/app/ships/list/' + ship._id]" mat-menu-item>
        <mat-icon
          ><span class="material-symbols-outlined">
            space_dashboard
          </span></mat-icon
        >
        <span>Shipping Package List</span>
      </button>
    </ng-template>
  </ng-container>
</mat-menu>
